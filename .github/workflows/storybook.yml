name: Deploy Storybook

on:
  push:
    branches:
      - main
  # En pull requests solo se valida que Storybook compile (no se despliega).
  pull_request:
  workflow_dispatch:

# Permisos mínimos requeridos por GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; uno nuevo cancela el que está en curso.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Storybook 10 requiere Node >= 20.19 o >= 22.12
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build Storybook
        run: npm run build:storybook
        env:
          STORYBOOK_DISABLE_TELEMETRY: '1'

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
